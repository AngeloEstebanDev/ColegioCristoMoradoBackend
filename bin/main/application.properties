spring.application.name=CristoMorado_api

spring.config.import=optional:file:./local.properties,optional:file:./ColegioCristoMoradoBackend/local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/colegiocristomorado}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

