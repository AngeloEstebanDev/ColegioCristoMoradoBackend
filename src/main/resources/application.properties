spring.application.name=CristoMorado_api

# ========================================================================
# Todo lo que cambia entre tu computadora y la nube se lee de VARIABLES
# DE ENTORNO. Si no existen, se usan los valores locales de siempre.
#  - En tu computadora: la contraseña de PostgreSQL va en local.properties
#    (ese archivo no se sube a GitHub).
#  - En Render: se configuran en Environment (ver GUIA_DESPLIEGUE.md).
# ========================================================================
spring.config.import=optional:file:./local.properties

# ========================================
# CONEXIÓN A POSTGRESQL (local o Neon)
# ========================================
# Neon: jdbc:postgresql://<host>.neon.tech/neondb?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/colegiocristomorado}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pocas conexiones: el plan gratis de Neon y Render tienen límites.
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}
spring.datasource.hikari.minimum-idle=1
# Neon se "duerme": espera hasta 30 s a que despierte antes de fallar.
spring.datasource.hikari.connection-timeout=30000

# ========================================
# JPA / HIBERNATE
# ========================================
# Mantiene la estructura de las tablas existente (y agrega columnas nuevas).
spring.jpa.hibernate.ddl-auto=update
# Mostrar el SQL en consola: true en local, false en la nube (SHOW_SQL=false).
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ========================================
# SERVIDOR
# ========================================
# Render asigna el puerto en la variable PORT.
server.port=${PORT:8080}

# ========================================
# CORS: desde qué páginas se puede usar la API
# ========================================
# Separadas por comas y SIN "/" al final. Ej. en Render:
# CORS_ORIGENES=https://cristomorado.vercel.app,http://localhost:4200
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

# ========================================
# CORREO (códigos de verificación)
# ========================================
# Opción A - Gmail por SMTP (sirve en tu computadora):
#   activa la verificación en 2 pasos del Gmail y crea una "Contraseña de aplicación"
#   en https://myaccount.google.com/apppasswords. Define MAIL_USERNAME y MAIL_PASSWORD.
# Opción B - Brevo por HTTPS (para Render gratis, que bloquea los puertos SMTP):
#   define BREVO_API_KEY y MAIL_USERNAME (el Gmail verificado como remitente en Brevo).
#   Si BREVO_API_KEY existe se usa Brevo; si no, Gmail SMTP.
# NUNCA escribas contraseñas en este archivo (el repositorio es público).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.correo.brevo-api-key=${BREVO_API_KEY:}

# Solo se aceptan correos @gmail.com al vincular.
app.correo.solo-gmail=true
