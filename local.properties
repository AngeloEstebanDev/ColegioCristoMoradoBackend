# Configuración SOLO para tu computadora (no se sube a GitHub ni a Render).
# Contraseña de tu PostgreSQL local:
DB_PASSWORD=alianzalima

# ------------------------------------------------------------------
# CORREO (vincular Gmail, cambiar y recuperar contraseña)
# Opción A (recomendada, igual que la nube): copia de Render > Environment
# los valores de MAIL_RELAY_URL y MAIL_RELAY_SECRET y pégalos aquí, sin comillas.
MAIL_RELAY_URL=
MAIL_RELAY_SECRET=
#
# Opción B (solo local): Gmail por SMTP con una contraseña de aplicación de 16 letras
# (myaccount.google.com > Seguridad > Contraseñas de aplicaciones). Deja vacía la opción A.
#MAIL_USERNAME=tucorreo@gmail.com
#MAIL_PASSWORD=xxxxxxxxxxxxxxxx
#
# Respaldo para la exposición: si el correo falla o no está configurado,
# el código aparece en la consola del backend (nunca se usa en Render).
MAIL_MODO_CONSOLA=true
